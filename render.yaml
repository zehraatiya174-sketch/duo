# Render blueprint.
#
# One always-on container running Next.js and Socket.IO in a single process,
# plus an external Postgres. The database is deliberately NOT declared here:
# Render's own free Postgres expires after 30 days, whereas Neon's free tier
# does not, so DATABASE_URL points at Neon and is set by hand.
#
# Two constraints carried over from the Railway deployment, both load-bearing:
#
#   * Exactly one instance. Socket.IO runs without a Redis adapter, so a second
#     instance would put the two users in separate rooms and neither would see
#     the other's messages. Never enable autoscaling.
#
#   * The free plan sleeps after 15 minutes idle. While asleep the 30-second
#     purge sweep does not run, so view-once messages outlive their expiry —
#     a privacy bug, not just a slow cold start. Keep it awake with a free
#     uptime pinger hitting /api/health every 10 minutes; 744h/month sits just
#     under the 750h free allowance.

services:
  - type: web
    name: duo
    runtime: docker
    plan: free
    # Must match the Neon project's region (us-east-2). Ohio is Render's
    # us-east-2. Every request makes several sequential database round trips
    # inside one transaction, so a cross-country hop is not merely slower — at
    # ~70ms each it eats into Prisma's interactive-transaction timeout.
    region: ohio
    dockerfilePath: ./Dockerfile

    # Returns 503 while Postgres is unreachable, so a deploy that comes up
    # without its database is held back rather than routed to.
    healthCheckPath: /api/health

    # Migrations run here, not in a preDeployCommand: that feature is paid-only
    # ("available for paid web services, private services, and background
    # workers"), so on the free plan it would be silently skipped and the app
    # would boot against an empty database.
    #
    # Running them at start is safe *because* this service is pinned to one
    # instance — two containers racing the same migration is the failure this
    # would otherwise invite. `migrate deploy` is a no-op once applied, so
    # restarts cost one round trip. If it fails the container exits and Render
    # holds the previous version, which is the correct outcome.
    #
    # It lives here rather than in the Dockerfile's CMD so the image stays
    # host-agnostic — the same image still runs unchanged on Fly or Railway.
    #
    # The binary is called directly rather than through `npx`: the container
    # runs as the unprivileged `duo` user, which `useradd --system` gave no home
    # directory, and npx wants a writable cache under $HOME.
    dockerCommand: sh -c "./node_modules/.bin/prisma migrate deploy && npm start"

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # --- set these in the dashboard -------------------------------------
      # DATABASE_URL is Neon's pooled connection string.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTHORIZED_USER_1
        sync: false
      - key: AUTHORIZED_USER_2
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: VERIFICATION_PASSPHRASE
        sync: false

      # 64 hex characters. Changing it makes every existing upload unreadable.
      - key: MEDIA_ENCRYPTION_KEY
        sync: false
      - key: MEDIA_URL_SECRET
        generateValue: true

      # --- media storage --------------------------------------------------
      # Supabase, matching the last production configuration on Railway. The
      # bucket is named `Media` there — capital M, and the name is part of every
      # object path, so `duo-media` would 404 every upload and download.
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: Media

      # --- WebRTC relay ---------------------------------------------------
      # `lib/env.ts` refuses to boot in production without a TURN relay: STUN
      # alone cannot traverse symmetric NAT, so calls would simply never
      # connect and the browser reports nothing useful about why.
      # Provide TURN_USERNAME + TURN_CREDENTIAL, or TURN_STATIC_AUTH_SECRET.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

      # --- realtime -------------------------------------------------------
      - key: SOCKET_PATH
        value: /api/socket
      # Must name the real origin. A wildcard here would let any site open a
      # socket against this deployment.
      - key: SOCKET_CORS_ORIGINS
        fromService:
          type: web
          name: duo
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: duo
          envVarKey: RENDER_EXTERNAL_URL

      # --- public, inlined into the client bundle at BUILD time ------------
      # These are read by `next build`, not at boot: changing one needs a
      # rebuild, never just a restart. A restart silently keeps the old value.
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: duo
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_NAME
        value: Duo
      - key: NEXT_PUBLIC_SOCKET_PATH
        value: /api/socket
      # Chunked upload removes the per-request body cap, so what bounds a file
      # here is the free plan's 512 MB of RAM: completing an upload reassembles
      # it in memory and encrypts it, costing a few multiples of its size. The
      # server value is set explicitly because `MAX_UPLOAD_BYTES` otherwise
      # defaults to 512 MB, and the two must agree or the composer accepts
      # files the server will refuse.
      - key: NEXT_PUBLIC_MAX_UPLOAD_BYTES
        value: '104857600'
      - key: MAX_UPLOAD_BYTES
        value: '104857600'
